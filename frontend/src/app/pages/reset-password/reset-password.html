<main class="recovery-page"><section class="recovery-card"><a routerLink="/login" class="brand"><span>TG</span> TuPymeGestiona</a><span class="eyebrow">Nueva contraseña</span><h1>Protege tu cuenta</h1>@if (success()) {<div class="success" role="status">Contraseña actualizada. Redirigiendo al inicio de sesión…</div>} @else {<form [formGroup]="form" (ngSubmit)="submit()"><label for="password">Nueva contraseña<input id="password" type="password" formControlName="password" autocomplete="new-password" /></label><small>Usa al menos 8 caracteres y cumple las reglas de seguridad.</small><label for="passwordConfirmation">Repite la contraseña<input id="passwordConfirmation" type="password" formControlName="passwordConfirmation" autocomplete="new-password" /></label>@if (error()) {<div class="error" role="alert">{{ error() }}</div>}<button type="submit" [disabled]="isSubmitting()">{{ isSubmitting() ? 'Guardando...' : 'Cambiar contraseña' }}</button></form>}<a routerLink="/login" class="back-link">Volver al inicio de sesión</a></section></main>
