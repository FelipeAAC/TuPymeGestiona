<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-mark">TG</div>

      <div>
        <strong>TuPymeGestiona</strong>
        <span>Gestión empresarial</span>
      </div>
    </div>

    <nav class="sidebar-nav" aria-label="Navegación principal">
      <a routerLink="/app/dashboard" routerLinkActive="active"> Dashboard </a>

      <span class="nav-placeholder">Productos</span>
      <span class="nav-placeholder">Inventario</span>
      <span class="nav-placeholder">Clientes</span>
      <span class="nav-placeholder">Pedidos</span>
      <span class="nav-placeholder">Ventas</span>
      <span class="nav-placeholder">Mensajes</span>
    </nav>
  </aside>

  <div class="app-main">
    <header class="app-header">
      <div>
        <span class="header-context">TuPymeGestiona</span>
      </div>

      <div class="header-user">
        @if (currentUser(); as user) {
          <div class="header-user-info">
            <strong>{{ user.username }}</strong>

            @if (user.email) {
              <span>{{ user.email }}</span>
            }
          </div>

          <button
            type="button"
            class="logout-button"
            [disabled]="isLoggingOut()"
            (click)="logout()"
          >
            {{ isLoggingOut() ? 'Cerrando...' : 'Cerrar sesión' }}
          </button>
        }

        @if (logoutError()) {
          <span class="logout-error" role="alert">
            {{ logoutError() }}
          </span>
        }
      </div>
    </header>

    <main class="app-content">
      <router-outlet />
    </main>
  </div>
</div>
