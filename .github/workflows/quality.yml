name: Technical quality

on:
  push:
    branches: [develop-v2]
  pull_request:
    branches: [develop-v2]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DJANGO_SECRET_KEY: ci-only-secret-not-used-outside-tests
      DB_ENGINE: sqlite
      SII_ADAPTER_ENABLED: "false"
      SII_EXCHANGE_ENABLED: "false"
      MERCADO_PAGO_ENABLED: "false"
      TRANSACTIONAL_EMAIL_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: System packages for mysqlclient
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config default-libmysqlclient-dev

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt

      - name: Validate Python dependency graph
        run: python -m pip check

      - name: Django system check
        working-directory: backend
        run: python manage.py check

      - name: Verify migrations
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Backend suite
        working-directory: backend
        run: python manage.py test

      - name: Repository hygiene
        run: python scripts/qa/verify_repository_hygiene.py --repository .

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      NG_BUILD_MAX_WORKERS: "1"
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Reproducible install with install-script policy
        run: npm ci

      - name: Dependency audit - high and critical
        run: npm audit --audit-level=high

      - name: TypeScript strict unused checks
        run: npm run typecheck

      - name: Angular principal specs in isolated processes
        run: npm run test:isolated

      - name: Maintainers specs
        run: npm run test:maintainers

      - name: Production build - principal
        run: npm run build

      - name: Production build - maintainers
        run: npm run build:maintainers
