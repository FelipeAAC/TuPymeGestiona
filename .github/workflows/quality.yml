name: Technical quality

on:
  push:
    branches: [develop-v2]
  pull_request:
    branches: [develop-v2]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DB_ENGINE: sqlite
      SII_ADAPTER_ENABLED: "false"
      SII_EXCHANGE_ENABLED: "false"
      MERCADO_PAGO_ENABLED: "false"
      TRANSACTIONAL_EMAIL_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: System packages for mysqlclient
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config default-libmysqlclient-dev

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt

      - name: Validate Python dependency graph
        run: python -m pip check

      - name: Django system check
        working-directory: backend
        run: python manage.py check

      - name: Verify migrations
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Backend suite
        working-directory: backend
        run: python manage.py test

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      NG_BUILD_MAX_WORKERS: "1"
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Reproducible install with install-script policy
        run: npm ci

      - name: Dependency audit - high and critical
        run: npm audit --audit-level=high

      - name: Angular specs in isolated processes
        shell: bash
        run: |
          mapfile -t specs < <(find src/app -type f -name '*.spec.ts' | sort)
          if [ "${#specs[@]}" -eq 0 ]; then
            echo "No Angular specs were found."
            exit 1
          fi
          for spec in "${specs[@]}"; do
            echo "==> $spec"
            npm test -- --watch=false "--include=$spec"
          done

      - name: Production build
        run: npm run build
